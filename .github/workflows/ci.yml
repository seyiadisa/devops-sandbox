name: CI/CD

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install platform dependencies
        run: pip install -r platform/requirements.txt

      - name: Compile Python modules
        run: python -m py_compile platform/api.py platform/main.py sandbox_app/app.py

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck platform/*.sh monitor/*.sh

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known hosts
        run: |
          ssh-keyscan -p "${{ secrets.SERVER_SSH_PORT }}" "${{ secrets.SERVER_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -p "${{ secrets.SERVER_SSH_PORT }}" "${{ secrets.SERVER_SSH_USER }}"@"${{ secrets.SERVER_SSH_HOST }}" << EOF
          cd /var/www/devops-sandbox
          git pull origin main
          docker compose down
          docker compose up -d --build
          make up
          EOF
