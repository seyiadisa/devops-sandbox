services:
  nginx:
    ports:
      - "${NGINX_PORT}:80"

  prometheus:
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    ports:
      - "3000:3000"
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"

  loki:
    ports:
      - "3100:3100"
