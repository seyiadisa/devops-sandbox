name: ${PROJECT_NAME}

services:
  nginx:
    image: nginx:latest
    container_name: ${PROJECT_NAME}-nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./logs:/var/log/devops-sandbox
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: ${PROJECT_NAME}-api
    user: "0:0"
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      API_PORT: ${API_PORT}
      EDGE_NETWORK: ${EDGE_NETWORK}
      NGINX_PORT: ${NGINX_PORT}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL}
      DEFAULT_TTL_MINUTES: ${DEFAULT_TTL_MINUTES}
      SANDBOX_INTERNAL_PORT: ${SANDBOX_INTERNAL_PORT}
      LOKI_URL: http://loki:3100
    volumes:
      - ./platform:/app/platform
      - ./sandbox_app:/app/sandbox_app:ro
      - ./envs:/app/envs
      - ./logs:/app/logs
      - ./nginx:/app/nginx
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ['API_PORT'])"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - edge

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    networks:
      - edge

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitor/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - edge

  promtail:
    image: grafana/promtail:latest
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitor/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitor/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - edge

networks:
  edge:
    name: ${EDGE_NETWORK}

volumes:
  loki-data:
