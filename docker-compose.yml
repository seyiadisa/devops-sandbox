name: ${PROJECT_NAME:-devops-sandbox}

services:
  nginx:
    image: nginx:latest
    container_name: ${PROJECT_NAME:-devops-sandbox}-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./logs:/var/log/devops-sandbox
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: ${PROJECT_NAME:-devops-sandbox}-api
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-devops-sandbox}
      API_PORT: ${API_PORT:-8000}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-devops-sandbox-edge}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./platform:/app/platform
      - ./envs:/app/envs
      - ./logs:/app/logs
      - ./nginx:/app/nginx
    working_dir: /app/platform
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          'import os, urllib.request; urllib.request.urlopen(f"http://127.0.0.1:{os.getenv(''API_PORT'', ''8000'')}/health")',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - edge

networks:
  edge:
    name: ${DOCKER_NETWORK:-devops-sandbox-edge}
