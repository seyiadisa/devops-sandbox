server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sandbox-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_sandbox_env"]
        regex: ".+"
        action: keep
      - source_labels: ["__meta_docker_container_label_sandbox_env"]
        target_label: sandbox_env
      - source_labels: ["__meta_docker_container_label_sandbox_name"]
        target_label: sandbox_name
      - source_labels: ["__meta_docker_container_label_sandbox_role"]
        target_label: sandbox_role
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
